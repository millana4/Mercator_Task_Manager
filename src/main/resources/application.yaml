spring:
  application:
    name: taskmanager

  # --- Подбор аналогов ниши: группы вида изделия, признаки, веса ---
  # Отдельный файл niche-matching.yml, выгружен из ноутбука разбора признаков.
  config:
    import: classpath:niche-matching.yml

  # --- JSON: как таск-менеджер и парсер сопоставляют имена полей ---
  # Парсер (Python) отдаёт snake_case (card_price, reviews_count).
  # Java-поля — camelCase (cardPrice). Эта стратегия переводит одно в другое
  # автоматически в обе стороны (и при чтении ответов, и при отправке запросов).
  jackson:
    property-naming-strategy: SNAKE_CASE

  # --- Postgres: актуальное состояние сета ---
  # Порт 5433 — наш контейнерный Postgres (5432 занят системным Postgres).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/taskmanager}
    username: ${SPRING_DATASOURCE_USERNAME:taskmanager}
    password: ${SPRING_DATASOURCE_PASSWORD:taskmanager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Схемой управляет Flyway, а не Hibernate. validate = Hibernate только
      # сверяет соответствие сущностей реальной схеме, но сам её не меняет.
      ddl-auto: validate
    open-in-view: false

  # --- Flyway: миграции схемы Postgres ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# --- ClickHouse: отдельная база замеров. Настраивается вручную в коде,
#     здесь только параметры подключения. Порт 8123 — HTTP-интерфейс. ---
clickhouse:
  url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/taskmanager}
  username: ${CLICKHOUSE_USERNAME:default}
  password: ${CLICKHOUSE_PASSWORD:taskmanager}

# --- Парсер Ozon (внешний сервис на FastAPI) ---
parser:
  ozon:
    base-url: ${PARSER_OZON_URL:http://localhost:8010}
    api-key: ${PARSER_API_KEY:}

logging:
  level:
    root: INFO
    com.mercator.taskmanager: INFO
    org.hibernate.SQL: WARN

server:
  port: 8080

# --- Потоковый обход (Redis-очередь) ---
# Ключи Redis-списков строятся как <prefix>:<geo>, например parse:tasks:spb.
taskmanager:
  # Регион этого экземпляра ядра. Используется для ключей Redis (parse:tasks:<код>)
  # и как geo результатов. Один экземпляр ядра = один регион.
  geo: ${TASKMANAGER_GEO:Санкт-Петербург}
  monitoring:
    # Целевой размер буфера очереди обхода. Планировщик доливает до него.
    queue-buffer: ${MONITORING_QUEUE_BUFFER:10}
    # Как часто планировщик проверяет/доливает очередь, мс.
    refill-interval-ms: ${MONITORING_REFILL_INTERVAL_MS:10000}
    # Окно ожидания результата, мин. Если по отправленной карточке результат
    # не пришёл за это время — она снова становится кандидатом (переотправка).
    inflight-timeout-minutes: ${MONITORING_INFLIGHT_TIMEOUT_MINUTES:45}
    # Интервал планового обхода по категориям, ч: карточка попадает в обход,
    # когда с её замера прошёл интервал. Категории не из списка в обход не попадают.
    intervals: ${MONITORING_INTERVALS:kids_clothing=10,clothing=23}
    # Темп постановки = Σ(активных карточек категории / интервал) × rate-margin:
    # задачи идут равномерно; запас покрывает капчи и повторы.
    rate-margin: ${MONITORING_RATE_MARGIN:1.2}
    reserve:
      # Карточка просрочена, если без замера дольше интервала + lag-extra-hours.
      lag-extra-hours: ${MONITORING_RESERVE_LAG_EXTRA_HOURS:1}
      # Доля просроченных в какой-либо категории выше on-share — отставание:
      # сигнал резервным парсерам, обход без ограничения темпа, учащение на паузе.
      # Ниже off-share во всех категориях — отставание снято.
      on-share: ${MONITORING_RESERVE_ON_SHARE:0.05}
      off-share: ${MONITORING_RESERVE_OFF_SHARE:0.02}
      # Срок жизни ключа сигнала, с: ядро не отвечает — ключ истекает, резерв останавливается.
      signal-ttl-seconds: ${MONITORING_RESERVE_SIGNAL_TTL_SECONDS:120}
    boost:
      # Учащённый обход при резком скачке цены (price): |ln(новая / прошлая)| > ln(1 + threshold).
      threshold: ${MONITORING_BOOST_THRESHOLD:0.35}
      # Учащение снимается, когда цена вернулась к цене до скачка в пределах
      # return-tolerance или продержалась hold-hours (новая реальная цена).
      return-tolerance: ${MONITORING_BOOST_RETURN_TOLERANCE:0.03}
      hold-hours: ${MONITORING_BOOST_HOLD_HOURS:48}
      # Интервал обхода карточки на учащении, мин, и потолок карточек на учащении.
      interval-minutes: ${MONITORING_BOOST_INTERVAL_MINUTES:60}
      max-cards: ${MONITORING_BOOST_MAX_CARDS:30}
  redis:
    # Префиксы ключей списков задач/результатов (гео добавляется в коде).
    parse-tasks-prefix: ${REDIS_PARSE_TASKS_PREFIX:parse:tasks}
    parse-results-prefix: ${REDIS_PARSE_RESULTS_PREFIX:parse:results}
    select-tasks-prefix: ${REDIS_SELECT_TASKS_PREFIX:select:tasks}
    select-results-prefix: ${REDIS_SELECT_RESULTS_PREFIX:select:results}
    search-tasks-prefix: ${REDIS_SEARCH_TASKS_PREFIX:search:tasks}
    search-results-prefix: ${REDIS_SEARCH_RESULTS_PREFIX:search:results}
    # Ключ-сигнал резервным парсерам: <prefix>:<маркетплейс>:<гео>, стоит пока обход отстаёт.
    reserve-signal-prefix: ${REDIS_RESERVE_SIGNAL_PREFIX:monitoring:reserve}
  search-snapshot:
    # Снимки поисковой выдачи по стратам. Время - МСК, формат:
    # категория=ЧЧ:ММ[,ЧЧ:ММ];категория=ЧЧ:ММ
    enabled: ${SEARCH_SNAPSHOT_ENABLED:true}
    schedule: ${SEARCH_SNAPSHOT_SCHEDULE:kids_clothing=18:37}
    # Задачи прогона раскладываются на окно (мин) и уходят в search:tasks по одной-две,
    # вперемешку с обходом. 0 — все задачи сразу, как ручной запуск.
    spread-minutes: ${SEARCH_SNAPSHOT_SPREAD_MINUTES:240}
  season:
    # Сбор нового сезонного сета (статус collecting): не больше одной задачи подбора
    # за select-interval-minutes, пока обход не отстаёт; повтор страты с дефицитом —
    # не раньше select-retry-hours после прошлой задачи.
    enabled: ${SEASON_ENABLED:true}
    select-interval-minutes: ${SEASON_SELECT_INTERVAL_MINUTES:30}
    select-retry-hours: ${SEASON_SELECT_RETRY_HOURS:12}
    tick-ms: ${SEASON_TICK_MS:60000}
    # Проверка готовности сетов в сборе и переключение (МСК): через 30 мин после батча аналитики.
    switch-cron: ${SEASON_SWITCH_CRON:0 15 1,13 * * *}
  niche:
    # Размер ниши: target-count — сколько карточек нужно для анализа,
    # plan-count — сколько держать на парсинге (с запасом на выбывание).
    target-count: ${NICHE_TARGET_COUNT:30}
    plan-count: ${NICHE_PLAN_COUNT:34}
    # Автодобор: поиск новых кандидатов на дефицит × candidate-multiplier
    # (запас на отсев по близости и на непрошедшие проверку).
    candidate-multiplier: ${NICHE_CANDIDATE_MULTIPLIER:2}
    # Первичный подбор: пачки до plan-count отобранных карточек, затем ниша active.
    # Пачка — недостающее до plan-count число карточек, но не больше select-batch-size.
    select-batch-size: ${NICHE_SELECT_BATCH_SIZE:10}
    # Как часто планировщик ниш продвигает ниши по статусам, мс.
    scheduler-interval-ms: ${NICHE_SCHEDULER_INTERVAL_MS:30000}
    # Сколько неудачных обращений к нейросети допускается, затем ниша failed.
    llm-max-attempts: ${NICHE_LLM_MAX_ATTEMPTS:3}
    # Пауза после неудачного обращения к нейросети перед повтором, мин.
    llm-retry-delay-minutes: ${NICHE_LLM_RETRY_DELAY_MINUTES:5}
    # Окно ожидания результата подбора ниши, ч: пачка первичного подбора отправляется повторно,
    # поиск автодобора снимается (его опоздавший результат ещё принимается).
    select-timeout-hours: ${NICHE_SELECT_TIMEOUT_HOURS:12}
    # Пауза после неудачного подбора перед повтором, мин.
    select-retry-delay-minutes: ${NICHE_SELECT_RETRY_DELAY_MINUTES:30}
    # Поиск новых кандидатов автодобора по нише — не чаще раза в N часов.
    refill-interval-hours: ${NICHE_REFILL_INTERVAL_HOURS:6}
    # Поиск не принёс новых кандидатов (выдача исчерпана) - следующий через 24 ч, после второго
    # такого подряд - через 72 ч; поиск с новыми кандидатами возвращает обычный интервал.
    refill-empty-backoff-hours: ${NICHE_REFILL_EMPTY_BACKOFF_HOURS:24,72}
yandex:
  ai:
    # Yandex AI Studio, OpenAI-совместимый Chat Completions API
    api-url: ${YANDEX_API_URL:https://llm.api.cloud.yandex.net/v1}
    api-key: ${YANDEX_API_KEY:}
    folder-id: ${YANDEX_FOLDER_ID:}
    model: ${YANDEX_MODEL:deepseek-v4-flash}
    temperature: ${YANDEX_TEMPERATURE:0.2}
    max-tokens: ${YANDEX_MAX_TOKENS:500}
    timeout-seconds: ${YANDEX_TIMEOUT_SECONDS:60}
analytics:
  # Сервис аналитики (контейнер an-app в сети ядра): готовность сета для переключения
  # сезона. Ключ — тот же межсервисный PARSER_API_KEY (= SERVICE_API_KEY аналитики).
  url: ${ANALYTICS_URL:http://an-app:8020}
  api-key: ${PARSER_API_KEY:}
  timeout-seconds: ${ANALYTICS_TIMEOUT_SECONDS:30}
embedder:
  # Сервис эмбеддингов (mercator_embedder), контейнер emb-app в сети ядра.
  # Ключ — тот же межсервисный PARSER_API_KEY.
  url: ${EMBEDDER_URL:http://emb-app:8000}
  # С запасом: первый запрос после простоя загружает модель.
  timeout-seconds: ${EMBEDDER_TIMEOUT_SECONDS:600}