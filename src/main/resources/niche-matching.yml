# Подбор аналогов ниши (детская одежда). Выгружено из ноутбука, ячейка 25.
niche-matching:
  top-n: 10
  weights:
    text: 0.55
    price: 0.15
    size: 0.1
    natural: 0.1
    temperature: 0.1
  text-sim-floor: 0.9
  text-sim-ceil: 0.99
  price-zero-ratio: 2.0
  temp-zero-diff: 20.0
  dup-price-tolerance: 0.05
  dup-ignore-keys: ["Цвет"]
  foot-groups: ["Носки", "Пинетки"]
  default-features: ["Коллекция", "Материал", "Страна-изготовитель", "Цвет", "Состав материала", "Рисунок", "Стиль", "Сезон", "Вид застежки", "Материал подкладки", "Покрой"]
  # «Тип» вне групп — своя группа из одного значения; признаков нет — default-features
  groups:
    - name: "Боди"
      types: ["Боди"]
      features: ["Вид застежки", "Вырез горловины", "Декоративные элементы", "Коллекция", "Материал", "Материал подкладки", "Рисунок", "Состав материала", "Стиль", "Страна-изготовитель", "Тип рукава", "Цвет"]
    - name: "Брюки"
      types: ["Брюки"]
      features: ["Коллекция", "Материал", "Сезон", "Стиль", "Страна-изготовитель", "Тип посадки", "Цвет", "Вид застежки", "Состав материала", "Рисунок", "Модель", "Покрой", "Декоративные элементы"]
    - name: "Джинсы"
      types: ["Джинсы"]
      features: ["Материал", "Материал подкладки", "Рисунок", "Сезон", "Состав материала", "Стиль", "Цвет", "Коллекция", "Вид застежки", "Страна-изготовитель", "Тип посадки", "Покрой", "Модель"]
    - name: "Жилет"
      types: ["Жилет"]
      features: ["Вид застежки", "Коллекция", "Материал", "Рисунок", "Сезон", "Страна-изготовитель", "Цвет", "Состав материала", "Стиль", "Длина одежды", "Материал подкладки", "Модель", "Покрой", "Утеплитель"]
    - name: "Колготки"
      types: ["Колготки"]
      features: ["Коллекция", "Материал", "Особенности модели", "Сезон", "Состав материала", "Стиль", "Тип посадки", "Цвет", "Состав комплекта", "Страна-изготовитель"]
    - name: "Комбинезон"
      types: ["Комбинезон", "Комбинезон утепленный", "Полукомбинезон"]
      features: ["Вид застежки", "Материал", "Тип рукава", "Коллекция", "Состав материала", "Стиль", "Страна-изготовитель", "Цвет", "Материал подкладки", "Сезон", "Покрой", "Рисунок"]
    - name: "Комплект"
      types: ["Комплект одежды", "Костюм классический"]
      features: ["Вид застежки", "Состав материала", "Коллекция", "Материал", "Страна-изготовитель", "Сезон", "Состав комплекта", "Цвет", "Стиль", "Рисунок", "Декоративные элементы", "Материал подкладки", "Модель", "Особенности модели", "Тип рукава"]
    - name: "Конверт"
      types: ["Конверт для новорожденного", "Аксессуар для коляски", "Комплект на выписку"]
      features: ["Вид застежки", "Коллекция", "Материал", "Страна-изготовитель", "Цвет", "Материал подкладки", "Рисунок", "Сезон", "Состав комплекта", "Утеплитель"]
    - name: "Купальник"
      types: ["Купальник"]
      features: ["Вид купальника", "Коллекция", "Материал", "Материал подкладки", "Состав материала", "Тип посадки", "Цвет", "Спортивное назначение", "Страна-изготовитель"]
    - name: "Куртка"
      types: ["Куртка", "Пуховик", "Ветровка", "Парка"]
      features: ["Цвет", "Материал", "Стиль", "Вид застежки", "Коллекция", "Утеплитель", "Состав материала", "Страна-изготовитель", "Длина одежды", "Материал подкладки", "Тип рукава", "Сезон", "Покрой"]
    - name: "Лонгслив"
      types: ["Лонгслив"]
      features: ["Коллекция", "Материал", "Покрой", "Состав материала", "Стиль", "Страна-изготовитель", "Цвет", "Рисунок", "Сезон", "Тип рукава", "Особенности модели"]
    - name: "Майка"
      types: ["Майка бельевая", "Майка"]
      features: ["Декоративные элементы", "Материал", "Состав материала", "Страна-изготовитель", "Цвет", "Коллекция", "Рисунок", "Стиль", "Особенности модели", "Состав комплекта"]
    - name: "Носки"
      types: ["Носки"]
      features: ["Коллекция", "Материал", "Рисунок", "Сезон", "Состав материала", "Спортивное назначение", "Стиль", "Цвет", "Страна-изготовитель", "Состав комплекта"]
    - name: "Пиджак"
      types: ["Пиджак"]
      features: ["Вид застежки", "Коллекция", "Материал", "Покрой", "Рисунок", "Сезон", "Стиль", "Страна-изготовитель", "Цвет", "Состав материала", "Тип рукава", "Материал подкладки", "Модель", "Особенности модели"]
    - name: "Пижама"
      types: ["Пижама"]
      features: ["Материал", "Цвет", "Сезон", "Страна-изготовитель", "Коллекция", "Состав материала", "Вид застежки", "Состав комплекта", "Модель", "Покрой", "Рисунок"]
    - name: "Пинетки"
      types: ["Пинетки"]
      features: ["Коллекция", "Материал", "Сезон", "Цвет", "Материал подкладки", "Состав материала", "Стиль", "Страна-изготовитель"]
    - name: "Плавки купальные"
      types: ["Плавки купальные"]
      features: ["Коллекция", "Материал", "Рисунок", "Состав материала", "Страна-изготовитель", "Тип посадки", "Цвет", "Материал подкладки", "Модель"]
    - name: "Платье"
      types: ["Платье"]
      features: ["Материал", "Состав материала", "Цвет", "Коллекция", "Сезон", "Страна-изготовитель", "Стиль", "Рисунок", "Вид застежки", "Материал подкладки", "Тип рукава"]
    - name: "Ползунки"
      types: ["Ползунки"]
      features: ["Материал", "Сезон", "Состав комплекта", "Состав материала", "Страна-изготовитель", "Цвет", "Коллекция", "Рисунок"]
    - name: "Рубашка"
      types: ["Рубашка", "Блузка"]
      features: ["Коллекция", "Материал", "Цвет", "Тип рукава", "Состав материала", "Вид застежки", "Стиль", "Страна-изготовитель", "Сезон", "Покрой", "Рисунок", "Особенности модели"]
    - name: "Свитшот"
      types: ["Свитшот", "Джемпер"]
      features: ["Состав материала", "Цвет", "Коллекция", "Материал", "Стиль", "Страна-изготовитель", "Сезон", "Вид застежки", "Тип рукава", "Рисунок", "Покрой"]
    - name: "Трусы"
      types: ["Трусы", "Комплект трусов"]
      features: ["Материал", "Материал подкладки", "Модель", "Рисунок", "Состав материала", "Стиль", "Страна-изготовитель", "Цвет", "Тип посадки", "Декоративные элементы", "Коллекция"]
    - name: "Футболка"
      types: ["Футболка"]
      features: ["Особенности модели", "Цвет", "Сезон", "Тип рукава", "Коллекция", "Материал", "Состав материала", "Покрой", "Рисунок", "Стиль", "Страна-изготовитель"]
    - name: "Худи"
      types: ["Худи", "Толстовка"]
      features: ["Цвет", "Коллекция", "Материал", "Страна-изготовитель", "Стиль", "Вид застежки", "Покрой", "Сезон", "Тип рукава", "Состав материала", "Рисунок", "Особенности модели", "Декоративные элементы"]
    - name: "Шорты"
      types: ["Шорты"]
      features: ["Коллекция", "Материал", "Материал подкладки", "Покрой", "Сезон", "Состав материала", "Страна-изготовитель", "Тип посадки", "Цвет", "Вид застежки", "Особенности модели", "Стиль", "Рисунок", "Декоративные элементы"]
    - name: "Юбка"
      types: ["Юбка"]
      features: ["Вид застежки", "Коллекция", "Материал", "Модель", "Особенности модели", "Покрой", "Рисунок", "Сезон", "Состав материала", "Стиль", "Страна-изготовитель", "Цвет", "Декоративные элементы", "Длина юбки/платья", "Материал подкладки", "Тип посадки"]
